name: Portable AppImage x86_64 (Debian 10 compatible)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install.sh
      - Makefile
      - assets/openai-codex-linux-repository-key.gpg.base64
      - launcher/**
      - scripts/build-*.sh
      - scripts/lib/package-common.sh
      - scripts/lib/upstream-linux-package.*
      - scripts/patches/**
      - linux-features/**
      - packaging/**
      - .github/workflows/appimage-portable.yml

permissions:
  contents: read

concurrency:
  group: portable-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-appimage:
    # GitHub-hosted x86_64 runner: the AppImage and every bundled .so are
    # built natively on x86_64 — no containers, emulation, or cross-compiling.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build the portable AppImage
        run: bash scripts/build-appimage-portable.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portable-appimage-x86_64
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
